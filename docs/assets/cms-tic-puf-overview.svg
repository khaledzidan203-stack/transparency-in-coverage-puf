  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="38" y="458" width="1126" height="118" rx="16" fill="#ffffff" stroke="#c9d7e6"/>
    <text x="58" y="486" fill="#173b63" font-size="18" font-weight="700">Governance & quality controls</text>
    <text x="58" y="512" fill="#31506f" font-size="13">• Separate issuer and plan grains prevent double counting</text>
    <text x="58" y="535" fill="#31506f" font-size="13">• Availability is modeled as data: AVAILABLE, suppressed, unavailable and structurally non-applicable remain explicit</text>
    <text x="58" y="558" fill="#31506f" font-size="13">• Rates use ratio-of-totals over governed comparable populations; source anomalies are preserved and disclosed</text>

    <text x="780" y="486" fill="#173b63" font-size="18" font-weight="700">Quality evidence</text>
    <text x="780" y="512" fill="#31506f" font-size="13">36 OPEN_REVIEW rows</text>
    <text x="780" y="535" fill="#31506f" font-size="13">2 preserved known-source rows</text>
    <text x="780" y="558" fill="#31506f" font-size="13">63 runtime DAX checks · 0 failures</text>
