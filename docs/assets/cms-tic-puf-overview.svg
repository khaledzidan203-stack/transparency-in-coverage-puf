<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CMS Transparency in Coverage PUF Analytics overview</title>
  <desc id="desc">Evidence-aligned overview of the project scope, architecture, model, Power BI delivery, data quality and validation.</desc>
